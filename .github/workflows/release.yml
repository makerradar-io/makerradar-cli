name: Release

# A tag `vX.Y.Z` publishes that version to npm (with provenance) and then the MCP Registry entry
# (`server.json`) that names it. Run by hand to publish only the registry entry (after a change to
# server.json that isn't a release).
#
# Secrets (Settings › Secrets and variables › Actions):
#   NPM_TOKEN                 a granular npm token that may publish `makerradar` (bypass 2FA)
#   MCP_REGISTRY_PRIVATE_KEY  the ed25519 private key (hex) whose public half makerradar.io serves at
#                             /.well-known/mcp-registry-auth — see CLAUDE.md › Releasing

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: each job gets only what it needs (the npm job adds `id-token: write` for
# provenance). Actions are pinned to commit SHAs and mcp-publisher to a release, so a moved tag or
# a new upstream release never runs with the registry key unreviewed: bump them deliberately.
permissions:
  contents: read

jobs:
  npm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag names the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} ≠ package.json v$version"; exit 1; }
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  mcp-registry:
    needs: [npm]
    if: ${{ !cancelled() && (needs.npm.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
      # A pinned release (the Go checksum database holds it to what was first published), never
      # @latest: this binary is handed MCP_REGISTRY_PRIVATE_KEY two steps on.
      - name: Install mcp-publisher
        run: go install github.com/modelcontextprotocol/registry/cmd/publisher@v1.8.7 && mv "$(go env GOPATH)/bin/publisher" /usr/local/bin/mcp-publisher
      - name: Wait until npm serves the package version server.json names
        run: |
          version="$(node -p "require('./server.json').packages.find(p => p.registryType === 'npm').version")"
          for i in $(seq 1 24); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/makerradar/$version")"
            [ "$code" = "200" ] && exit 0
            echo "npm answers $code for makerradar@$version; waiting ($i/24)"; sleep 5
          done
          echo "makerradar@$version isn't on npm yet: publish it first"; exit 1
      - run: mcp-publisher validate
      - name: Prove the domain and publish
        run: |
          mcp-publisher login http --domain makerradar.io --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          mcp-publisher publish
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
